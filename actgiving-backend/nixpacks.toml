# Konfigurasi Nixpacks untuk Laravel di Railway (PHP 8.4)

[phases.setup]
nixPkgs = [
    'php84',
    'php84Packages.composer',
    'php84Extensions.pdo_pgsql',
    'php84Extensions.mbstring',
    'php84Extensions.openssl',
    'php84Extensions.tokenizer',
    'php84Extensions.xml',
    'php84Extensions.ctype',
    'php84Extensions.json',
    'php84Extensions.bcmath',
    'caddy'
]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"

[phases.build]
cmds = [
    'composer install --no-dev --optimize-autoloader --prefer-dist',
    'chmod -R 775 storage bootstrap/cache'
]

[start]
cmd = 'php artisan migrate --force && (php artisan storage:link || true) && (php-fpm -D || true) && caddy run --config /app/Caddyfile --adapter caddyfile'
