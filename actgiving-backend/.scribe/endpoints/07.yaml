        content: '{"success":true,"data":[{"id":10,"user_id":2,"category_id":1,"title":"Uji Coba Moderasi Kampanye Baru 1792862057985","description":"Deskripsi lengkap uji coba kampanye baru agar masuk ke antrean moderasi admin.","target_amount":"10000000.00","current_amount":"0.00","target_volunteers":5,"current_volunteers":0,"location":"Bandung, Jawa Barat","activity_date":null,"status":"active","campaign_mode":"both","created_at":"2026-10-24T17:14:18.000000Z","updated_at":"2026-10-25T11:45:13.000000Z","image_url":null,"category":{"id":1,"category_name":"Bencana Alam","created_at":"2026-10-14T02:54:38.000000Z","updated_at":"2026-10-14T02:54:38.000000Z"},"user":{"id":2,"name":"Yayasan Peduli Bersama","email":"inisiator@actgiving.com","is_verified":true},"lpj_reports":[]},{"id":2,"user_id":4,"category_id":1,"title":"Bantuan Darurat Medis & Masker untuk Korban Kabut Asap Karhutla Kalimantan","description":"Kebakaran hutan dan lahan (Karhutla) di Kalimantan semakin meluas, menyebabkan kabut asap pekat yang menyelimuti pemukiman. Jarak pandang menurun drastis dan ribuan warga, terutama balita dan lansia, mulai berjatuhan sakit akibat ISPA (Infeksi Saluran Pernapasan Akut). Kami sangat membutuhkan dana darurat untuk pengadaan masker N95, tabung oksigen portabel, obat-obatan pernapasan, dan vitamin. Kami juga memanggil relawan untuk turun langsung membantu evakuasi warga rentan dan mendistribusikan bantuan medis dari rumah ke rumah. Mari bergerak cepat selamatkan napas saudara kita!","target_amount":"10000000.00","current_amount":"10010000.00","target_volunteers":20,"current_volunteers":1,"location":"Lumajang, Jawa Timur","activity_date":"2026-10-29T00:00:00.000000Z","status":"active","campaign_mode":"both","created_at":"2026-10-21T16:43:14.000000Z","updated_at":"2026-10-28T13:50:11.000000Z","image_url":"http:\/\/127.0.0.1:8000\/storage\/campaigns\/ff131484-5b78-4db8-a1f9-beb8cac09a76_1792647116.jpeg","category":{"id":1,"category_name":"Bencana Alam","created_at":"2026-1