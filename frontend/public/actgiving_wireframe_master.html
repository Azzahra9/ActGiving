<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActGiving - Master Wireframe Suite (Semua Role & Sketsa Kasar Memanjang untuk Figma)</title>
  <meta name="description" content="Koleksi Master Low-Fidelity Wireframe (Sketsa Kasar Blueprint UI) ActGiving untuk 4 Role: Donatur, Relawan, Inisiator (LPJ Web), dan Admin siap import Figma." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Space Mono"', 'monospace'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 font-mono antialiased flex flex-col min-h-screen">

  <!-- ==================== MASTER WIREFRAME SWITCHER TOP BAR ==================== -->
  <header class="bg-slate-950 border-b-2 border-slate-700 p-3 sticky top-0 z-50 text-xs">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-amber-400 rounded-full animate-ping"></span>
        <span class="font-bold text-white uppercase">[MASTER WIREFRAME / SKETSA KASAR SUITE]</span>
        <span class="text-slate-500">|</span>
        <span class="text-slate-400 text-[11px]">Pilih Role untuk Tinjauan Blueprint Figma:</span>
      </div>

      <div class="flex items-center gap-1.5 overflow-x-auto">
        <button onclick="switchWfRole('donatur')" id="btnWfDonatur" class="px-3 py-1.5 bg-amber-400 text-slate-950 font-bold border border-amber-300">
          🌐 1. Donatur WF (No Sidebar)
        </button>
        <button onclick="switchWfRole('relawan')" id="btnWfRelawan" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 font-semibold">
          🤝 2. Relawan WF (Sidebar + 4 Menu)
        </button>
        <button onclick="switchWfRole('inisiator')" id="btnWfInisiator" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 font-semibold">
          🚀 3. Inisiator WF (Sidebar + LPJ Web)
        </button>
        <button onclick="switchWfRole('admin')" id="btnWfAdmin" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 font-semibold">
          🛡️ 4. Admin WF (Sidebar + 4 Menu)
        </button>
        <a href="/actgiving_standalone.html" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold border border-blue-400 text-[11px]">
          🎨 Beralih ke Desain Hi-Fi ↗
        </a>
      </div>
    </div>
  </header>

  <!-- Container for IFRAME Views -->
  <main class="flex-1 w-full flex flex-col">
    
    <div id="viewWfDonatur" class="flex-1 w-full h-[calc(100vh-56px)]">
      <iframe src="/actgiving_wireframe_donatur.html" class="w-full h-full border-0 bg-white"></iframe>
    </div>

    <div id="viewWfRelawan" class="hidden flex-1 w-full h-[calc(100vh-56px)]">
      <iframe src="/actgiving_wireframe_relawan.html" class="w-full h-full border-0 bg-white"></iframe>
    </div>

    <div id="viewWfInisiator" class="hidden flex-1 w-full h-[calc(100vh-56px)]">
      <iframe src="/actgiving_wireframe_inisiator.html" class="w-full h-full border-0 bg-white"></iframe>
    </div>

    <div id="viewWfAdmin" class="hidden flex-1 w-full h-[calc(100vh-56px)]">
      <iframe src="/actgiving_wireframe_admin.html" class="w-full h-full border-0 bg-white"></iframe>
    </div>

  </main>

  <script>
    function switchWfRole(role) {
      document.getElementById('viewWfDonatur').classList.add('hidden');
      document.getElementById('viewWfRelawan').classList.add('hidden');
      document.getElementById('viewWfInisiator').classList.add('hidden');
      document.getElementById('viewWfAdmin').classList.add('hidden');

      const bDonatur = document.getElementById('btnWfDonatur');
      const bRelawan = document.getElementById('btnWfRelawan');
      const bInisiator = document.getElementById('btnWfInisiator');
      const bAdmin = document.getElementById('btnWfAdmin');

      const inactiveClass = 'px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 font-semibold';
      const activeClass = 'px-3 py-1.5 bg-amber-400 text-slate-950 font-bold border border-amber-300';

      [bDonatur, bRelawan, bInisiator, bAdmin].forEach(b => b.className = inactiveClass);

      if (role === 'donatur') {
        document.getElementById('viewWfDonatur').classList.remove('hidden');
        bDonatur.className = activeClass;
      } else if (role === 'relawan') {
        document.getElementById('viewWfRelawan').classList.remove('hidden');
        bRelawan.className = activeClass;
      } else if (role === 'inisiator') {
        document.getElementById('viewWfInisiator').classList.remove('hidden');
        bInisiator.className = activeClass;
      } else if (role === 'admin') {
        document.getElementById('viewWfAdmin').classList.remove('hidden');
        bAdmin.className = activeClass;
      }
    }
  </script>
</body>
</html>
